<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>~BgM's~ BioStack Community</title>
<style>
  :root {
    --bg: #f2ecd9;
    --surface: #f8f4e6;
    --surface-2: #ece4cd;
    --border: #d9cfb0;
    --border-soft: #e3dac0;
    --ink: #241f14;
    --ink-dim: #4f4736;
    --ink-faint: #746a52;
    --accent: #b5432f;
    --accent-dim: #8a331f;
    --accent-ink: #fdfaf2;
    --good: #256b40;
    --good-bg: #dcecd7;
    --warn: #8c4a18;
    --warn-bg: #f3e2ce;
    --bad: #c1121f;
    --bad-bg: #f7dcdc;
    --blue: #3f6690;
    --blue-bg: #dde7ef;
    --font-display: "Palatino Linotype", "Iowan Old Style", Georgia, "Times New Roman", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Cascadia Code", "Consolas", "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  a { color: inherit; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  .hidden { display: none !important; }

  /* header / plate */
  header.plate { padding: 30px 0 20px; text-align: center; border-bottom: 1px solid var(--border); position: relative; animation: rise .6s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: translateY(0);} }
  .mark { font-family: var(--font-display); font-style: normal; font-size: 21px; color: var(--accent); letter-spacing: .18em; cursor: pointer; }
  h1.wordmark { margin: 8px 0 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 5.6vw, 36px); letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
  .batch-line { margin-top: 10px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
  .status-row { margin-top: 16px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 3px; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; font-family: var(--font-mono); border: 1px solid var(--border); }
  .pill.open { color: var(--good); border-color: var(--good-bg); background: var(--good-bg); }
  .pill.dot::before { content: "●"; font-size: 8px; }
  .pill.plain { color: var(--ink-dim); }

  /* closed view */
  .closed-view { padding: 90px 20px; text-align: center; }
  .closed-view .icon { font-size: 40px; margin-bottom: 14px; }
  .closed-view h2 { font-family: var(--font-display); font-size: 26px; margin: 0 0 10px; }
  .closed-view p { color: var(--ink-dim); font-size: 14.5px; }

  /* cart bar */
  .cartbar { position: sticky; top: 0; z-index: 20; display: flex; justify-content: flex-end; align-items: center; padding: 10px 20px; margin: 0 -20px; background: rgba(242,236,217,.92); backdrop-filter: blur(4px); border-bottom: 1px solid var(--border); }
  .cart-pill { display: inline-flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--border-soft); color: var(--ink); font-family: var(--font-mono); font-size: 13px; padding: 8px 14px; border-radius: 20px; cursor: pointer; }
  .cart-pill .count { background: var(--accent); color: var(--accent-ink); font-weight: 700; border-radius: 50%; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
  .cart-pill .amt { color: var(--accent); font-variant-numeric: tabular-nums; }
  .cart-pill[disabled] { opacity: .4; cursor: default; }

  .intro { padding: 18px 0 4px; color: var(--ink-dim); font-size: 14.5px; line-height: 1.6; text-align: center; }
  .intro b { color: var(--ink); }

  /* customer-facing flyer, full size, top of storefront */
  .flyer-frame { margin-top: 18px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 6px 20px rgba(36,31,20,.15); }
  .flyer-frame img { display: block; width: 100%; height: auto; }

  /* batch-info block */
  .batch-info { padding: 18px 0 4px; }
  .batch-info-badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--good); background: var(--good-bg); border: 1px solid var(--good); border-radius: 20px; padding: 4px 11px; margin-bottom: 10px; }
  .batch-info ul.info-bullets { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .batch-info ul.info-bullets li { font-size: 13.5px; color: var(--ink-dim); display: flex; gap: 8px; align-items: flex-start; line-height: 1.5; }
  .batch-info ul.info-bullets li::before { content: "✓"; color: var(--good); font-weight: 700; flex: 0 0 auto; margin-top: 1px; }

  /* product list — two-column photo card grid */
  .card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 16px; padding-bottom: 130px; }
  @media (max-width: 560px) { .card-grid { grid-template-columns: 1fr; } }
  .pcard { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 14px 14px; display: flex; flex-direction: column; }
  .pcard.oos { opacity: .5; }
  .pcard .photo-wrap { aspect-ratio: 1 / 1; border-radius: 6px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--border-soft); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
  .pcard .photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pcard .photo-wrap .no-photo { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); text-align: center; padding: 0 10px; }
  .pcard .name { font-family: var(--font-display); font-size: 17px; font-weight: 700; text-align: center; }
  .pcard .spec { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-faint); letter-spacing: .03em; text-align: center; margin-top: 2px; }
  .tested { display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 7px; font-size: 11px; letter-spacing: .04em; color: var(--good); font-family: var(--font-mono); }
  .tested::before { content: "◆"; font-size: 9px; }
  .untested { display: block; text-align: center; margin-top: 7px; font-size: 11px; color: var(--ink-faint); font-family: var(--font-mono); }
  .oos-tag { display: block; text-align: center; margin-top: 7px; padding: 3px 9px; border-radius: 4px; background: var(--bad-bg); font-size: 12px; font-weight: 800; color: var(--bad); font-family: var(--font-mono); letter-spacing: .06em; text-transform: uppercase; }
  .price-block { text-align: center; margin-top: 10px; }
  .price { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 18px; color: var(--accent); }
  .price .cents { font-size: 12px; color: var(--accent-dim); }
  .qty { margin-top: 8px; display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
  .qty button { width: 30px; height: 30px; background: var(--surface-2); border: none; color: var(--ink-dim); font-family: var(--font-mono); font-size: 14px; cursor: pointer; }
  .qty button:disabled { opacity: .3; cursor: not-allowed; }
  .qty output { width: 30px; text-align: center; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13px; }

  .actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--border); padding: 12px 20px 14px; box-shadow: 0 -8px 24px rgba(0,0,0,.35); }
  .actionbar-inner { max-width: 720px; margin: 0 auto; }
  .ledger-line { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-dim); padding: 2px 0; }
  .ledger-line .amt { font-variant-numeric: tabular-nums; }
  .ledger-line.total { color: var(--ink); font-size: 15px; padding-top: 6px; margin-top: 4px; border-top: 1px solid var(--border-soft); }
  .ledger-line.total .amt { color: var(--accent); }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn { flex: 1; padding: 13px; border: none; border-radius: 3px; font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; cursor: pointer; text-align: center; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:disabled { background: var(--border); color: var(--ink-faint); cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--ink-dim); border: 1px solid var(--border); flex: 0 0 auto; padding: 13px 18px; }

  .flow-page { padding: 20px 0 140px; }
  .flow-page h2.page-title { font-family: var(--font-display); font-size: 22px; margin: 0 0 16px; }
  .read-tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; margin-bottom: 10px; background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; border-radius: 20px; }
  h2.page-title.not-amazon { font-size: clamp(24px, 6vw, 32px); background: linear-gradient(90deg, var(--accent), var(--ink)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 16px 18px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 8px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
  .card p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--ink-dim); }
  .card.risk { border-color: var(--warn-bg); background: var(--warn-bg); }
  .card.risk h3 { color: var(--warn); }
  .card.risk p { color: var(--ink); }
  .pay-line { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-soft); font-size: 13.5px; }
  .pay-line:last-child { border-bottom: none; }
  .pay-line .ok { color: var(--good); font-family: var(--font-mono); font-size: 12px; }
  .pay-line .fee { color: var(--warn); font-family: var(--font-mono); font-size: 12px; }

  .acknowledge-row { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; }
  .acknowledge-row input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); }
  .acknowledge-row span { font-size: 13.5px; color: var(--ink); }

  .summary-line { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; }
  .summary-line .n { color: var(--ink-dim); }
  .summary-line .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  .form-field { margin-bottom: 12px; }
  .form-field label { display: block; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); font-family: var(--font-mono); margin-bottom: 6px; }
  .form-field input[type="text"], .form-field input[type="tel"], .form-field input[type="email"], .form-field select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--ink); font-family: var(--font-body); font-size: 15px; padding: 11px 12px; border-radius: 4px; }
  .field-err { color: var(--warn); font-size: 12px; margin-top: 4px; }

  .pay-panel { border: 1px solid var(--border); border-radius: 6px; padding: 18px; margin-bottom: 14px; }
  .pay-panel.usdc { border-color: var(--good-bg); background: var(--good-bg); }
  .pay-panel.venmo { border-color: var(--blue-bg); background: var(--blue-bg); }
  .pay-panel h3 { margin: 0 0 4px; font-family: var(--font-display); font-size: 18px; }
  .pay-panel h3.usdc-h { color: var(--good); }
  .pay-panel h3.venmo-h { color: var(--blue); }
  .pay-panel .sub { font-size: 12.5px; color: var(--ink-dim); margin-bottom: 12px; }
  .warn-box { background: var(--warn-bg); border: 1px solid var(--warn); color: var(--warn); font-family: var(--font-mono); font-size: 12px; padding: 9px 11px; border-radius: 3px; margin-bottom: 12px; letter-spacing: .02em; }
  .wallet-row { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; }
  .wallet-row code { flex: 1; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink); word-break: break-all; }
  .copy-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--ink-dim); font-family: var(--font-mono); font-size: 11px; padding: 6px 10px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
  .venmo-link-btn { display: block; text-align: center; text-decoration: none; background: var(--blue); color: var(--accent-ink); font-weight: 700; padding: 13px; border-radius: 4px; margin-top: 10px; font-family: var(--font-mono); letter-spacing: .05em; text-transform: uppercase; font-size: 13px; }
  .after-pay-note { margin-top: 12px; font-size: 12.5px; color: var(--ink-dim); background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; }

  /* admin */
  .admin-login { max-width: 360px; margin: 90px auto; padding: 0 20px; }
  .admin-login h2 { font-family: var(--font-display); font-size: 24px; text-align: center; margin-bottom: 20px; }
  .admin-pad { padding: 22px 0 60px; }
  .admin-topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .admin-topbar .title { font-family: var(--font-display); font-size: 20px; }
  .logout-btn { background: transparent; border: 1px solid var(--border); color: var(--ink-dim); font-family: var(--font-mono); font-size: 11px; padding: 7px 12px; border-radius: 3px; cursor: pointer; }
  .admin-tabs { display: flex; gap: 2px; margin-bottom: 18px; border: 1px solid var(--border); border-radius: 4px; padding: 3px; flex-wrap: wrap; }
  .admin-tabs button { flex: 1; font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; background: transparent; color: var(--ink-faint); border: none; padding: 9px 6px; border-radius: 2px; cursor: pointer; }
  .admin-tabs button.active { background: var(--surface-2); color: var(--accent); }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 18px 20px; margin-bottom: 16px; }
  .panel h2 { margin: 0 0 14px; font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
  .field-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border-soft); flex-wrap: wrap; }
  .field-row:last-child { border-bottom: none; }
  .field-row label { font-size: 13.5px; color: var(--ink-dim); }
  .toggle-open { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; cursor: pointer; background: none; border: none; padding: 0; }
  .toggle-open .sw { width: 32px; height: 18px; border-radius: 9px; position: relative; border: 1px solid var(--border); background: var(--surface-2); }
  .toggle-open .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; background: var(--ink-faint); border-radius: 50%; transition: all .15s; }
  .toggle-open.on { color: var(--good); }
  .toggle-open.on .sw { background: var(--good-bg); border-color: var(--good); }
  .toggle-open.on .sw::after { background: var(--good); left: 16px; }
  input[type="number"], input.admin-input-text, textarea.admin-input, select.admin-input { background: var(--bg); border: 1px solid var(--border); color: var(--ink); font-family: var(--font-mono); font-size: 13px; padding: 7px 9px; border-radius: 3px; }
  input[type="number"] { width: 90px; text-align: right; }
  input.admin-input-text { width: 100%; max-width: 320px; }
  textarea.admin-input { width: 100%; min-height: 140px; font-size: 12.5px; line-height: 1.6; }
  input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .slider-block { padding: 9px 0 4px; }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin-top: 8px; }
  .slider-readout { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-dim); }
  .slider-readout b { color: var(--accent); font-size: 15px; font-variant-numeric: tabular-nums; }
  .preview-line { margin-top: 12px; font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-faint); background: var(--surface-2); border: 1px dashed var(--border); border-radius: 3px; padding: 9px 11px; }
  .preview-line b { color: var(--accent); font-variant-numeric: tabular-nums; }
  .save-btn { background: var(--accent); color: var(--accent-ink); border: none; font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; padding: 9px 16px; border-radius: 3px; cursor: pointer; margin-top: 12px; }
  .ghost-small-btn { background: transparent; border: 1px solid var(--border); color: var(--ink-dim); font-family: var(--font-mono); font-size: 11px; padding: 7px 12px; border-radius: 3px; cursor: pointer; }
  table.summary { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 13px; }
  table.summary th { text-align: left; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; padding: 0 0 8px; border-bottom: 1px solid var(--border); }
  table.summary th.num, table.summary td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.summary td { padding: 8px 0; border-bottom: 1px solid var(--border-soft); color: var(--ink-dim); }
  table.summary td.pname { color: var(--ink); }
  table.summary tfoot td { border-bottom: none; border-top: 1px solid var(--border); padding-top: 10px; color: var(--ink); font-weight: 700; }
  table.summary tfoot td.num { color: var(--accent); }
  .prod-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-soft); }
  @media (max-width: 480px) { .prod-row { grid-template-columns: 1fr; } .prod-row > button { justify-self: start; } }
  .prod-row .pn { font-size: 13.5px; }
  .prod-row .pn .sp { color: var(--ink-faint); font-family: var(--font-mono); font-size: 11px; display: block; }
  .mini-btn { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; padding: 5px 9px; border-radius: 3px; border: 1px solid var(--border); background: transparent; color: var(--ink-faint); cursor: pointer; }
  .mini-btn.on { color: var(--good); border-color: var(--good); }
  .mini-btn.del { color: var(--warn); }
  .order-detail { border: 1px solid var(--border-soft); border-radius: 4px; margin-bottom: 8px; overflow: hidden; }
  .order-detail summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; color: var(--ink); background: var(--surface-2); gap: 8px; }
  .order-detail summary::-webkit-details-marker { display: none; }
  .order-detail summary::after { content: "＋"; color: var(--ink-faint); font-family: var(--font-mono); }
  .order-detail[open] summary::after { content: "－"; }
  .order-detail .body { padding: 12px 14px; font-family: var(--font-mono); font-size: 12.5px; }
  .order-detail .line { display: flex; justify-content: space-between; padding: 4px 0; color: var(--ink-dim); }
  .order-detail .line.total { color: var(--ink); border-top: 1px solid var(--border-soft); margin-top: 4px; padding-top: 8px; }
  .order-detail .line .v { font-variant-numeric: tabular-nums; }
  .repeat-flag { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--warn); font-family: var(--font-mono); letter-spacing: .04em; white-space: nowrap; }
  .fee-tag { font-size: 10.5px; color: var(--good); font-family: var(--font-mono); white-space: nowrap; }
  .print-btn { margin-top: 10px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; background: transparent; border: 1px solid var(--border); color: var(--ink-dim); padding: 6px 12px; border-radius: 3px; cursor: pointer; }
  .batch-picker { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .batch-picker select { flex: 1; min-width: 180px; }
  .err-msg { color: var(--warn); font-size: 13px; margin-top: 8px; }

  footer.sig { text-align: center; padding: 24px 0 90px; font-size: 11px; color: var(--ink-faint); letter-spacing: .08em; text-transform: uppercase; font-family: var(--font-mono); }

  #printSlip { display: none; }
  @media print {
    html, body { background: #fff !important; }
    body > *:not(#printSlip) { display: none !important; }
    #printSlip { display: block !important; position: static; width: 100%; padding: 20px; margin: 0; color: #000; background: #fff; }
  }

  @media (max-width: 420px) { .wrap { padding: 0 14px; } .cartbar { padding: 10px 14px; margin: 0 -14px; } }
</style>

<script>

function money(n) { return '$' + Number(n || 0).toFixed(2); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function api(path, opts = {}) {
  const { headers: extraHeaders, ...rest } = opts;
  return fetch(SUPA_URL + '/rest/v1/' + path, {
    ...rest,
    headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json', ...extraHeaders }
  });
}
function apiAuth(path, opts = {}) {
  const { headers: extraHeaders, ...rest } = opts;
  return fetch(SUPA_URL + '/rest/v1/' + path, {
    ...rest,
    headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + S.adminToken, 'Content-Type': 'application/json', Prefer: 'return=representation', ...extraHeaders }
  });
}
function storageAuth(path, opts = {}) {
  const { headers: extraHeaders, ...rest } = opts;
  return fetch(SUPA_URL + '/storage/v1/' + path, {
    ...rest,
    headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + S.adminToken, ...extraHeaders }
  });
}
function adminSessionExpired() {
  S.adminToken = null;
  sessionStorage.removeItem('v3_admin_token');
  render();
}

// ============================================================
// INIT / DATA LOAD
// ============================================================
async function init() {
  render();
  try {
    const [bRes, pRes] = await Promise.all([
      api('rpc/get_active_v3_batch', { method: 'POST', body: '{}' }),
      api('rpc/get_active_v3_products', { method: 'POST', body: '{}' })
    ]);
    const batches = await bRes.json();
    S.batch = Array.isArray(batches) && batches[0] ? batches[0] : null;
    const products = await pRes.json();
    S.products = Array.isArray(products) ? products : [];
  } catch (e) {
    S.batch = null;
  }
  render();
}

// ============================================================
// CART
// ============================================================
function cartCount() { return Object.values(S.cart).reduce((a, b) => a + b, 0); }
function cartSubtotal() {
  return S.products.reduce((sum, p) => sum + (S.cart[p.id] || 0) * Number(p.price), 0);
}
function changeQty(id, d) {
  const p = S.products.find(x => x.id === id);
  if (!p || p.in_stock === false) return;
  const cur = S.cart[id] || 0;
  const next = Math.max(0, cur + d);
  if (next === 0) delete S.cart[id]; else S.cart[id] = next;
  render();
}

// ============================================================
// ORDER SUBMIT
// ============================================================
async function submitOrder() {
  S.submitError = '';
  const items = Object.entries(S.cart).filter(([,q]) => q > 0).map(([product_id, qty]) => ({ product_id, qty }));
  if (items.length === 0) return;
  const contact = S.contact === 'other' ? (S.contactOther.trim() || 'Not specified') : S.contact;
  try {
    const res = await api('rpc/submit_v3_order', {
      method: 'POST',
      body: JSON.stringify({
        p_name: S.form.name.trim(),
        p_phone: S.form.phone.trim(),
        p_email: S.form.email.trim(),
        p_contact: contact,
        p_items: items
      })
    });
    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      S.submitError = errBody.message || 'Could not submit order — please try again.';
      render();
      return;
    }
    const data = await res.json();
    S.pendingOrder = Array.isArray(data) ? data[0] : data;
    S.step = 'payment';
    S.payChoice = null;
    render();
  } catch (e) {
    S.submitError = 'Could not reach the server — check your connection and try again.';
    render();
  }
}

function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}
function copyWallet() { copyToClipboard(CRYPTO_ADDRESS); const b = event.target; b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy Address', 1500); }
function copyVenmo() { copyToClipboard(VENMO_HANDLE); const b = event.target; b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy Handle', 1500); }

  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  return !!name && phoneDigits.length >= 10 && emailOk;
}

function goStep(s) {

  if (s === 'browse') S.pendingOrder = null;
  S.step = s;
  window.scrollTo(0, 0);
  render();
}
function goAdmin() {
  S.route = 'admin';
  render();
  if (S.adminToken) loadAdminData();
}
function goStore() { S.route = 'store'; render(); init(); }

function render() {
  const app = document.getElementById('app');
  if (S.route === 'admin') { app.innerHTML = adminHtml(); return; }

  let html;
  if (!S.batch) {
    html = closedHtml();
  } else {
    if (S.step === 'browse') html = browseHtml();
    else if (S.step === 'ack') html = ackHtml();
    else if (S.step === 'checkout') html = checkoutHtml();
    else if (S.step === 'payment') html = paymentHtml();
  }
  app.innerHTML = html + `<footer class="sig">~BgM's~ BioStack Community</footer>`;
}

async function adminLogin(email, password, errElId) {
  const errEl = document.getElementById(errElId);
  if (errEl) errEl.textContent = '';
  try {
    const res = await fetch(SUPA_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { apikey: SUPA_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (res.ok && data.access_token) {
      S.adminToken = data.access_token;
      sessionStorage.setItem('v3_admin_token', S.adminToken);
      await loadAdminData();
      render();
    } else if (errEl) {
      errEl.textContent = 'Incorrect email or password.';
    }
  } catch (e) {
    if (errEl) errEl.textContent = 'Login failed — check your connection.';

async function loadAdminData() {
  S.adminBusy = true;
  S.adminErr = '';
  try {
    const res = await apiAuth('v3_batches?select=*&order=created_at.desc');
    if (res.status === 401) { adminSessionExpired(); return; }
    if (!res.ok) {
      S.adminErr = 'Could not load your batches (server error) — your data is safe, this is just a display problem. Tap Retry.';
      S.adminBusy = false;
      render();
      return;
    }
    S.adminBatches = await res.json();
    if (!S.adminSelectedBatchId && S.adminBatches[0]) S.adminSelectedBatchId = S.adminBatches[0].id;
    await loadBatchDetail();
  } catch (e) {
    S.adminErr = 'Could not reach the server — check your connection and tap Retry. Your data is safe.';
  }
  S.adminBusy = false;
  render();
}

async function loadBatchDetail() {
  if (!S.adminSelectedBatchId) { S.adminProducts = []; S.adminOrders = []; return; }
  try {
    const [prodRes, ordRes] = await Promise.all([
      apiAuth(`v3_products?batch_id=eq.${S.adminSelectedBatchId}&select=*&order=sort_order.asc`),
      apiAuth(`v3_orders?batch_id=eq.${S.adminSelectedBatchId}&select=*&order=created_at.desc`)
    ]);
    if (prodRes.status === 401 || ordRes.status === 401) { adminSessionExpired(); return; }
    if (!prodRes.ok || !ordRes.ok) {
      S.adminErr = 'Could not load this batch\'s products/orders (server error) — your data is safe. Tap Retry.';
      return;
    }
    S.adminProducts = await prodRes.json();
    S.adminOrders = await ordRes.json();
  } catch (e) {
    S.adminErr = 'Could not reach the server loading this batch — check your connection and tap Retry. Your data is safe.';
  }
}

function currentAdminBatch() { return S.adminBatches.find(b => b.id === S.adminSelectedBatchId) || null; }

function localTimeStr(dt) {

}

async function uploadFlyerImage(file, bucket, field) {
  const b = currentAdminBatch();
  if (!b || !file) return;
  S.adminErr = '';
  const extMatch = /\.([a-zA-Z0-9]+)$/.exec(file.name || '');
  const ext = (extMatch ? extMatch[1] : (file.type || '').split('/')[1] || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
  const path = `${b.id}/${Date.now()}.${ext}`;
  try {
    const res = await storageAuth(`object/${bucket}/${path}`, {
      method: 'POST',
      headers: { 'Content-Type': file.type || 'application/octet-stream' },
      body: file
    });
    if (res.status === 401) { adminSessionExpired(); return; }
    if (!res.ok) {
      const errText = await res.text().catch(() => '');
      S.adminErr = `Image upload failed (${res.status}): ${errText || 'unknown error'}`;
      render();
      return;
    }
  } catch (e) {
    S.adminErr = `Image upload failed — could not reach the server: ${e.message}`;
    render();
    return;
  }
  // Cost flyer bucket is private (2026-09-01 fix) -- store just the object
  // path, not a public URL, since a public URL to a private object is
  // useless. The customer flyer bucket stays public, keep saving its full
  // public URL as before.
  const valueToSave = field === 'cost_flyer_url'
    ? path
    : `${SUPA_URL}/storage/v1/object/public/${bucket}/${path}`;
  await saveBatchField(field, valueToSave);
}

// Cost flyer is private -- this fetches a short-lived signed URL (requires
// the admin's auth token) so the image loads without ever being a plain
// public link. Cached per-path in S.costFlyerSigned so a render loop
// doesn't re-request it every time; a fresh batch load or a new upload
// (new path) triggers a fresh sign.
async function loadCostFlyerSignedUrl(b) {
  const path = b.cost_flyer_url;
  if (!path) return;
  S.costFlyerSigned = { path, url: null };
  try {
    const res = await storageAuth(`object/sign/v3-cost-flyer-images/${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ expiresIn: 3600 })
    });
    if (res.status === 401) { adminSessionExpired(); return; }
    if (!res.ok) return;
    const data = await res.json();
    if (data.signedURL && S.costFlyerSigned.path === path) {
      S.costFlyerSigned.url = SUPA_URL + '/storage/v1' + data.signedURL;
      render();
    }
  } catch (e) {}
}

async function uploadProductImage(file, productId) {

  const path = `${productId}/${Date.now()}.${ext}`;
  try {
    const res = await storageAuth(`object/v3-product-images/${path}`, {
      method: 'POST',
      headers: { 'Content-Type': file.type || 'application/octet-stream' },
      body: file
    });
    if (res.status === 401) { adminSessionExpired(); return; }
    if (!res.ok) {
      const errText = await res.text().catch(() => '');

async function replaceProductList(text) {
  const b = currentAdminBatch();
  if (!b) return;
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const items = lines.map(line => {
    const parts = line.split('|').map(s => s.trim());
    return { batch_id: b.id, name: parts[0] || 'Unnamed', spec: parts[1] || '', cost: parseFloat(parts[2]) || 0, category: parts[3] || null };
  }).filter(i => i.name);
  if (items.length === 0) return;
  const res = await apiAuth('rpc/replace_v3_batch_products', {
    method: 'POST',
    body: JSON.stringify({ p_batch_id: b.id, p_products: items })
  });
  if (res.status === 401) { adminSessionExpired(); return; }
  if (!res.ok) { S.adminErr = 'Could not save the product list — nothing was changed.'; render(); return; }
  await loadBatchDetail();
  render();
}

async function moveProduct(id, direction) {
  const idx = S.adminProducts.findIndex(p => p.id === id);
  const swapIdx = idx + direction;
  if (idx === -1 || swapIdx < 0 || swapIdx >= S.adminProducts.length) return;
  const a = S.adminProducts[idx];
  const b = S.adminProducts[swapIdx];
  const [resA, resB] = await Promise.all([
    apiAuth(`v3_products?id=eq.${a.id}`, { method: 'PATCH', body: JSON.stringify({ sort_order: b.sort_order }) }),
    apiAuth(`v3_products?id=eq.${b.id}`, { method: 'PATCH', body: JSON.stringify({ sort_order: a.sort_order }) })
  ]);
  if (resA.status === 401 || resB.status === 401) { adminSessionExpired(); return; }
  await loadBatchDetail();
  render();
}

async function setFeeWaived(id, waived) {

  const newShipCharged = waived ? 0 : (Number(b.shipping_fee) || 0);

// Sums each order's line items for Boyd's Summary. Per-line cost is looked up
// against the *current* product list by product_id when possible, but a
// batch's product list gets fully deleted+reinserted (new IDs) on every
// bulk-paste save, which orphans product_id on any order placed before that
// save. Rather than let orphaned lines silently show $0, this reconciles each
// order's lines against that order's own stored cost_total (captured
// correctly at order time and never stale) — matched lines use their real
// per-unit cost, and any leftover is split across unmatched lines in
// proportion to what the customer paid for them. Grand Total is therefore
// always the true sum of cost_total across orders, whether or not today's
// product list still contains the exact rows those orders were placed against.
function computeBoydSummaryTotals() {
  const totals = {};
  let qtyTotal = 0, costTotal = 0;
  S.adminOrders.forEach(o => {
    const items = o.items || [];
    const resolved = items.map(i => {
      const prod = S.adminProducts.find(p => p.id === i.product_id);
      const unitCost = prod ? Number(prod.cost) : null;
      return { i, unitCost, lineValue: Number(i.unit_price) * i.qty };
    });
    const matchedCost = resolved.reduce((s, r) => s + (r.unitCost !== null ? r.unitCost * r.i.qty : 0), 0);
    const remaining = (Number(o.cost_total) || 0) - matchedCost;
    const unmatched = resolved.filter(r => r.unitCost === null);
    const unmatchedValueSum = unmatched.reduce((s, r) => s + r.lineValue, 0);
    resolved.forEach(r => {
      const lineCost = r.unitCost !== null
        ? r.unitCost * r.i.qty
        : unmatchedValueSum > 0
          ? remaining * (r.lineValue / unmatchedValueSum)
          : (unmatched.length ? remaining / unmatched.length : 0);
      const key = r.i.name + '|' + (r.i.spec || '');
      if (!totals[key]) totals[key] = { name: r.i.name, spec: r.i.spec, qty: 0, cost: 0 };
      totals[key].qty += r.i.qty;
      totals[key].cost += lineCost;
      qtyTotal += r.i.qty;
      costTotal += lineCost;
    });
  });
  return { rows: Object.values(totals), qtyTotal, costTotal };
}

function adminSummaryTab(b) {
  const { rows, qtyTotal, costTotal } = computeBoydSummaryTotals();
  return `
    <div class="panel">
      <h2>Boyd's Summary — ${esc(b.label)}</h2>
      <div style="overflow-x:auto">
        <table class="summary">
          <thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Cost Total</th></tr></thead>
          <tbody>${rows.map(r => `<tr><td class="pname">${esc(r.name)}${r.spec ? ' — ' + esc(r.spec) : ''}</td><td class="num">${r.qty}</td><td class="num">${money(r.cost)}</td></tr>`).join('') || `<tr><td colspan="3" style="color:var(--ink-faint)">No orders yet this batch.</td></tr>`}</tbody>
          <tfoot><tr><td>Grand Total</td><td class="num">${qtyTotal}</td><td class="num">${money(costTotal)}</td></tr></tfoot>
        </table>
      </div>
      <button class="print-btn" onclick="printBoydSummary()">Print Page</button>
    </div>`;
}

function printBoydSummary() {
  const b = currentAdminBatch();
  if (!b) return;
  const { rows, qtyTotal, costTotal } = computeBoydSummaryTotals();
  const html = `
    <h2>~BgM's~ BioStack Community — Boyd's Summary</h2>
    <p><b>${esc(b.label)}</b></p>
    <table style="width:100%;border-collapse:collapse;margin-top:10px">
      <thead><tr><th style="text-align:left">Product</th><th style="text-align:right;padding-left:36px">Qty</th><th style="text-align:right;padding-left:36px">Cost Total</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td>${esc(r.name)}${r.spec ? ' — ' + esc(r.spec) : ''}</td><td style="text-align:right;padding-left:36px">${r.qty}</td><td style="text-align:right;padding-left:36px">$${r.cost.toFixed(2)}</td></tr>`).join('')}</tbody>
    </table>
    <p style="font-size:16px;margin-top:10px"><b>Grand Total: ${qtyTotal} items — $${costTotal.toFixed(2)}</b></p>`;
  document.getElementById('printSlip').innerHTML = html;
  window.print();
}
