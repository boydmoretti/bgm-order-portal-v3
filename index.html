.header{background:linear-gradient(135deg,#1e3a5f,#0f2542);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.4)}

.header h1{font-size:14px;font-weight:700}
.header p{font-size:10px;opacity:.7;margin-top:2px;letter-spacing:.6px;text-transform:uppercase}
.cart-btn{background:#22c55e;color:#fff;border:none;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}

.admin-gear{background:none;border:none;color:rgba(255,255,255,0.3);font-size:11px;cursor:pointer;margin-left:8px}

.round-badge{background:#fff;margin:10px 14px 0;border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.08);font-size:12px;color:#475569}

.open-dot{color:#22c55e;font-weight:700}

.search-bar{padding:10px 14px;background:#fff;border-bottom:1px solid #e2e8f0;margin-top:8px}

.jump-bar::-webkit-scrollbar-track{background:#f1f5f9}
.jump-bar::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:999px}
.jump-btn{padding:5px 12px;border-radius:999px;border:none;cursor:pointer;font-size:11px;font-weight:600;white-space:nowrap;background:#f1f5f9;color:#475569;flex-shrink:0}
.jump-btn:active{background:#1e3a5f;color:#fff}

/* PRODUCT TABLE */
table{width:100%;border-collapse:collapse;margin-top:8px}
thead th{padding:6px 10px;font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #e2e8f0;background:#f8fafc}
th.r,td.r{text-align:right}
tbody tr{border-bottom:1px solid rgba(0,0,0,0.05)}
td{padding:7px 10px;font-size:13px;vertical-align:middle}
.sku{display:inline-block;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:800;margin-right:4px;background:rgba(0,0,0,0.08);color:rgba(0,0,0,0.6)}

.qrow{display:flex;align-items:center;gap:5px;justify-content:flex-end}
.qbtn{width:29px;height:29px;border-radius:7px;border:none;cursor:pointer;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;-webkit-appearance:none}
.qbtn.plus{background:#22c55e;color:#fff}
.qbtn.minus{background:#e2e8f0;color:#aaa}
.qbtn.minus.on{background:#dc2626;color:#fff}
.qnum{min-width:22px;text-align:center;font-size:14px;font-weight:700;color:#0f2542}
.qbtn.plus.disabled{background:#e2e8f0;color:#ccc;cursor:not-allowed}

.cb-sub{opacity:.6;font-size:11px;margin-top:1px}
.co-btn{background:#22c55e;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer}

.odetail{font-size:11px;color:#94a3b8;margin-top:2px}

.oeach{font-size:10px;color:#94a3b8;font-weight:400}

.sld{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#e2e8f0;border-radius:999px;transition:.3s}
.sld:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}

    <div class="vtotal" style="color:#1e40af;font-size:26px">Pay $${pt.venmoTotal.toFixed(2)}</div>

    <a href="venmo://paycharge?txn=pay&recipients=Boyd-Moretti&amount=${pt.venmoTotal.toFixed(2)}" class="vhandle" style="background:#008CFF;color:#fff;border-radius:8px;padding:13px;margin:10px 0">Open Venmo & Pay 👆</a>
    <div style="font-size:12px;color:#64748b">Pays <strong>@Boyd-Moretti</strong> · Note: <strong>Reimbursement</strong></div></div>

    <button class="paychoice-btn paychoice-venmo" onclick="choosePay('venmo')">💸 Pay with Venmo<br><span style="font-size:12px;font-weight:500">+${S.venmoSurcharge}% fee — $${pt.venmoTotal.toFixed(2)}</span></button>`;

function rAdmin(){
  if(!S.adminAuth)return hdr("Admin","~BgM's~ BioStack Community",true)+`<div class="al"><h2>🔐 Admin Login</h2><p>Sign in with your admin account</p><input class="finput" type="email" id="aemail" placeholder="Email" style="max-width:280px;margin:0 auto 8px"/><input class="finput" type="password" id="apw" placeholder="Password" style="max-width:280px;margin:0 auto 12px"/><br><button class="sbtn" style="max-width:200px;margin:0 auto" onclick="alog()">Login</button><p id="aerr" style="color:#dc2626;font-size:13px;margin-top:8px"></p></div>`;
  const ro=S.orders.filter(o=>o.round===S.roundNum);
  const oh=ro.length===0?`<div class="empty">No orders yet for Group Order #${S.roundNum}</div>`:ro.map((o,i)=>{
    const copyText=`${o.name} | ${o.phone} | ${o.email}${o.connection?" | Via: "+o.connection:""} | ${o.items.map(x=>`${x.sku} x${x.qty} $${x.price*x.qty}`).join(", ")} | Total: $${o.total.toFixed(2)} | Pay: ${o.payment_method==='venmo'?('Venmo (+$'+((o.venmo_fee||0).toFixed(2))+')'):(o.payment_method==='usdc'?'USDC':'Not chosen')}`;
    return `<div class="ocard"><div class="ocard-hdr"><span class="ocard-name">${esc(o.name)}</span><span class="ocard-tot">$${o.total.toFixed(2)}</span></div><div class="ocard-info">${esc(o.phone)} · ${esc(o.email)} · ${esc(o.date)}</div>${o.connection?`<div class="ocard-info">🔗 Connection: <strong>${esc(o.connection)}</strong></div>`:""}${o.tip>0?`<div class="ocard-info">💰 Tip: <strong>$${o.tip}</strong></div>`:""}<div class="ocard-info" style="color:${(o.payment_method==='venmo')?'#008CFF':((o.payment_method==='usdc')?'#10b981':'#f59e0b')};font-weight:700">${(o.payment_method==='venmo')?('💸 VENMO (+$'+((o.venmo_fee||0).toFixed(2))+' fee)'):((o.payment_method==='usdc')?'✅ USDC (Ethereum)':'⏳ Payment not chosen yet')}</div><div class="ocard-items">${o.items.map(x=>`${esc(x.sku)} × ${x.qty} = $${x.price*x.qty}`).join(" | ")}</div><div class="ocard-footer"><button class="ocard-print" data-idx="${i}">🖨 Print</button><button class="ocard-copy" data-copy="${copyText.replace(/"/g,'&quot;')}">Copy</button></div></div>`;
  }).join("");
  return hdr("Admin Panel","Group Order #"+S.roundNum,true)+
  `<div class="aw"><div class="asec"><h3>⚙️ Order Round Control</h3>
    <div class="trow2"><span class="tlbl">Portal ${S.roundOpen?"🟢 OPEN":"🔴 CLOSED"}</span><label class="tgl"><input type="checkbox" id="rtog" ${S.roundOpen?"checked":""}><span class="sld"></span></label></div>
    <input class="dinput" type="text" id="cd" placeholder="Close date (e.g. April 30, 2026)" value="${S.closeDate}"/>
    <div class="trow2" style="margin-top:4px"><span class="tlbl">📋 Group Order #</span><input class="dinput" type="number" id="rnum" min="1" max="99" value="${S.roundNum}" style="width:70px;margin-bottom:0;text-align:center"/></div>
    <div style="font-size:11px;color:#94a3b8;margin-bottom:10px">Current group order number shown to customers.</div>
    <div class="trow2" style="margin-top:4px"><span class="tlbl">Bac Water &amp; Acetic Acid ${S.waterOos?"🔴 OOS":"🟢 Available"}</span><label class="tgl"><input type="checkbox" id="wtog" ${!S.waterOos?"checked":""}><span class="sld"></span></label></div>
    <div style="font-size:11px;color:#94a3b8;margin-bottom:10px">Toggle ON to make water items available for purchase</div>
    <div class="trow2" style="margin-top:4px"><span class="tlbl">💸 Venmo Surcharge %</span><input class="dinput" type="number" id="vsi" min="0" max="100" value="${S.venmoSurcharge}" style="width:90px;margin-bottom:0;text-align:center"/></div>
    <div style="font-size:11px;color:#94a3b8;margin-bottom:10px">Venmo orders add this % on top of the full total.</div>
    <button class="savebtn" onclick="saveSt()">Save</button>
  </div>
  <div class="tabrow"><button class="tabbtn ${S.adminTab==="orders"?"on":""}" onclick="sat('orders')">📦 Orders (${ro.length})</button><button class="tabbtn ${S.adminTab==="vivian"?"on":""}" onclick="sat('vivian')">📋 Vivian Summary</button></div>
  ${S.adminTab==="orders"?`<div class="asec"><h3>Orders — Group #${S.roundNum}</h3>${oh}</div>`:`<div class="asec"><h3>Vivian Order Summary</h3><div class="vbox2" id="vt">${vivian()}</div><button class="cpybtn" id="cpybtn" onclick="cpy()">📋 Copy to Clipboard</button></div>`}
  <div style="text-align:right;margin-top:8px"><button class="lgout" onclick="alo()">Logout</button></div></div>`;
}

function bind(){
  document.querySelectorAll("[data-s]").forEach(b=>b.addEventListener("click",()=>{const s=b.dataset.s,d=parseInt(b.dataset.d),n=Math.max(0,(S.cart[s]||0)+d);if(n===0)delete S.cart[s];else S.cart[s]=n;const scrollY=window.scrollY;render();window.scrollTo(0,scrollY);}));
  const jb=document.querySelector(".jump-bar");
  if(jb){jb.addEventListener("wheel",e=>{e.preventDefault();jb.scrollLeft+=e.deltaY;},{passive:false});let isDown=false,startX,scrollLeft;jb.addEventListener("mousedown",e=>{isDown=true;startX=e.pageX-jb.offsetLeft;scrollLeft=jb.scrollLeft;});jb.addEventListener("mouseleave",()=>isDown=false);jb.addEventListener("mouseup",()=>isDown=false);jb.addEventListener("mousemove",e=>{if(!isDown)return;e.preventDefault();const x=e.pageX-jb.offsetLeft;jb.scrollLeft=scrollLeft-(x-startX);});}
  const si=document.getElementById("si");
  if(si){si.addEventListener("input",e=>{S.search=e.target.value;const tbody=document.querySelector("tbody");const noRes=document.querySelector(".empty");const filtered=fl();if(filtered.length===0){if(tbody)tbody.closest("table").outerHTML=`<div class="empty">No products found for "${esc(S.search)}" — <button onclick="S.search='';render()" style="background:none;border:none;color:#1e3a5f;font-weight:700;cursor:pointer">Clear</button></div>`;}else{const newRows=filtered.map(p=>buildRow(p)).join("");if(tbody)tbody.innerHTML=newRows;else if(noRes)noRes.outerHTML=`<table><thead><tr><th>SKU / Product</th><th class="r">Price/Kit</th><th class="r" style="width:100px">Qty</th></tr></thead><tbody>${newRows}</tbody></table>`;}document.querySelectorAll("[data-s]").forEach(b=>b.addEventListener("click",()=>{const s=b.dataset.s,d=parseInt(b.dataset.d),n=Math.max(0,(S.cart[s]||0)+d);if(n===0)delete S.cart[s];else S.cart[s]=n;const scrollY=window.scrollY;render();window.scrollTo(0,scrollY);}));});}
  document.querySelectorAll(".ocard-print").forEach(b=>b.addEventListener("click",()=>{const idx=parseInt(b.dataset.idx);const ro=S.orders.filter(o=>o.round===S.roundNum);const o=ro[idx];if(!o)return;const itemRows=o.items.map(x=>`<tr><td>${x.sku}</td><td>${x.name}</td><td>${x.mg}</td><td style="text-align:center">${x.qty}</td><td style="text-align:right">$${x.price}/kit</td><td style="text-align:right">$${x.price*x.qty}</td></tr>`).join("");const html=`<!DOCTYPE html><html><head><title>Packing Slip - ${o.name}</title><style>body{font-family:Arial,sans-serif;padding:40px;max-width:600px;margin:0 auto}h1{font-size:22px;margin-bottom:4px}h2{font-size:14px;color:#555;font-weight:normal;margin-bottom:20px}.info{margin-bottom:20px;font-size:14px;line-height:1.8}table{width:100%;border-collapse:collapse;margin-bottom:20px}th{background:#1e3a5f;color:#fff;padding:8px;text-align:left;font-size:13px}td{padding:8px;border-bottom:1px solid #e2e8f0;font-size:13px}.totals{text-align:right;font-size:14px;line-height:2}.grand{font-size:18px;font-weight:bold;color:#1e3a5f}.footer{margin-top:30px;font-size:11px;color:#999;text-align:center;border-top:1px solid #e2e8f0;padding-top:12px}@media print{button{display:none}}</style></head><body><h1>~BgM's~ BioStack Community</h1><h2>2026 ZLZ PEPTIDE — GROUP ORDER #${o.round} PACKING SLIP</h2><div class="info"><strong>Name:</strong> ${o.name}<br><strong>Phone:</strong> ${o.phone}<br><strong>Email:</strong> ${o.email}<br><strong>Date:</strong> ${o.date}<br>${o.connection?`<strong>Connection:</strong> ${o.connection}<br>`:""}</div><table><thead><tr><th>SKU</th><th>Product</th><th>Size</th><th style="text-align:center">Qty</th><th style="text-align:right">Price</th><th style="text-align:right">Total</th></tr></thead><tbody>${itemRows}</tbody></table><div class="totals"><div>Products: $${o.subtotal.toFixed(2)}</div><div>Shipping: $${o.shipping.toFixed(2)}</div>${(o.venmo_fee&&o.venmo_fee>0)?`<div>Venmo Fee: $${o.venmo_fee.toFixed(2)}</div>`:""}<div class="grand">TOTAL DUE: $${o.total.toFixed(2)}</div><div style="font-size:13px;margin-top:6px">Payment: ${o.payment_method==='venmo'?'Venmo':(o.payment_method==='usdc'?'USDC (Ethereum)':'Not chosen')}</div></div><div class="footer">For experimental research use only.<br>Thank you for your order!</div><br><button onclick="window.print()" style="padding:10px 30px;background:#1e3a5f;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">Print This Page</button></body></html>`;const blob=new Blob([html],{type:"text/html"});const url=URL.createObjectURL(blob);window.open(url,"_blank");}));
  document.querySelectorAll(".ocard-copy").forEach(b=>b.addEventListener("click",()=>{navigator.clipboard.writeText(b.dataset.copy).then(()=>{b.textContent="Copied!";setTimeout(()=>b.textContent="Copy",1500);});}));
  const fn=document.getElementById("fn");if(fn)fn.addEventListener("input",e=>{S.form.name=e.target.value;ub();});
  const fp=document.getElementById("fp");if(fp)fp.addEventListener("input",e=>{S.form.phone=e.target.value;ub();});
  const fe=document.getElementById("fe");if(fe)fe.addEventListener("input",e=>{S.form.email=e.target.value;ub();});
  const tipSel=document.getElementById("tipsel");
  if(tipSel)tipSel.addEventListener("change",e=>{S.tip=parseInt(e.target.value)||0;const tbig=document.querySelector(".tbig span:last-child");if(tbig)tbig.textContent="$"+tot().toFixed(2);});
  ub();
}
function ub(){const b=document.getElementById("sbtn");if(b)b.disabled=!(S.form.name&&S.form.phone&&S.form.email);}
function gc(){S.screen="checkout";S.tip=0;window.scrollTo(0,0);render();}
function gb(){S.screen="browse";window.scrollTo(0,0);render();}
function ga(){S.screen="admin";if(ADMIN_TOKEN)S.adminAuth=true;window.scrollTo(0,0);render();if(S.adminAuth)loadOrders().then(()=>render());}
function jumpTo(name){S.search=name;render();}
function alo(){S.adminAuth=false;ADMIN_TOKEN=null;sessionStorage.removeItem("bgm_admin_token");S.screen="browse";render();}
function newOrd(){S.cart={};S.form={name:"",phone:"",email:""};S.screen="browse";S.payChoice="";S.pendingOrderId=null;S.pendingTotals=null;S.isRepeat=false;S.ackChecked=false;S.tip=0;render();}
function sat(t){S.adminTab=t;if(t==="orders"&&S.adminAuth)loadOrders().then(()=>render());else render();}
async function submit(){
  if(!S.form.name||!S.form.phone||!S.form.email)return;
  const connSel=document.getElementById("connsel");
  const connOther=document.getElementById("connother");
  let conn=connSel?connSel.value:"";
  if(conn==="Other")conn=connOther?connOther.value.trim():"";
  if(!conn){alert("Please select or enter your connection name.");return;}
  S.connection=conn;
  const btn=document.getElementById("sbtn");
  if(btn){btn.disabled=true;btn.textContent="Submitting...";}
  S.isRepeat=await checkRepeat();
  await saveOrd();
  S.payChoice="";
  S.screen="confirm";render();
}
function gck(){if(cc()<1)return;S.ackChecked=false;S.screen="ack";window.scrollTo(0,0);render();}
function toggleAck(){S.ackChecked=!S.ackChecked;render();}
function ackContinue(){if(!S.ackChecked)return;S.screen="checkout";S.tip=0;window.scrollTo(0,0);render();}
async function choosePay(method){
  S.payChoice=method;
  const pt=S.pendingTotals;
  if(S.pendingOrderId!=null&&pt){
    const fee=method==="venmo"?pt.venmoFee:0;
    const finalTotal=method==="venmo"?pt.venmoTotal:pt.usdcTotal;
    try{await supaPatch("orders","id=eq."+S.pendingOrderId,{payment_method:method,venmo_fee:fee,total:finalTotal});}catch(e){}
  }
  window.scrollTo(0,0);render();
}
function backPay(){S.payChoice="";window.scrollTo(0,0);render();}
function copyAddr(){const btn=event.target;function showCopied(){btn.textContent="✅ Copied!";setTimeout(()=>btn.textContent="📋 Copy Wallet Address",1500);}function fallbackCopy(){const ta=document.createElement("textarea");ta.value=CRYPTO_ADDRESS;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand("copy");showCopied();}catch(e){alert("Copy failed — please copy manually:\n"+CRYPTO_ADDRESS);}document.body.removeChild(ta);}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(CRYPTO_ADDRESS).then(showCopied).catch(fallbackCopy);}else{fallbackCopy();}}
async function alog(){
  const email=document.getElementById("aemail").value.trim();
  const pw=document.getElementById("apw").value;
  const errEl=document.getElementById("aerr");
  errEl.textContent="";
  try{
    const res=await fetch(SUPA_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":SUPA_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password:pw})});
    const data=await res.json();
    if(res.ok&&data.access_token){
      ADMIN_TOKEN=data.access_token;
      sessionStorage.setItem("bgm_admin_token",ADMIN_TOKEN);
      S.adminAuth=true;
      loadOrders().then(()=>render());
    }else{
      errEl.textContent="Incorrect email or password";
    }
  }catch(e){errEl.textContent="Login failed — check your connection.";}
}
function cpy(){const t=document.getElementById("vt").innerText;navigator.clipboard.writeText(t).then(()=>{const b=document.getElementById("cpybtn");b.textContent="✅ Copied!";b.classList.add("done");setTimeout(()=>{b.textContent="📋 Copy to Clipboard";b.classList.remove("done");},2000);});}

loadSettings().then(()=>render());
</script>
